name: Windows offline regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        shell: pwsh
        run: |
          $env:CONDUCTOR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'agora-offline-tests'
          python -X utf8 -m unittest discover -p 'test*.py'
